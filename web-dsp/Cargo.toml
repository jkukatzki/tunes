[package]
name = "tunes-web-dsp"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tunes = { path = "..", features = ["worker"] }
# Keep generated glue compatible with the frontend lockfile and packaging CLI.
wasm-bindgen = "=0.2.128"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
